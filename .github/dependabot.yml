# Auto-merge: thin caller -> dcyfr-labs/.github reusable; native auto-merge gated
# on the 'main protection' ruleset. Patch/minor only; majors stay manual.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

    # react and react-dom must move in lockstep: react-dom asserts at runtime
    # that both packages report the exact same version, so a solo bump of
    # either one fails every test file that renders (5/8 files, PRs #198/#207).
    # Ungrouped, neither PR can ever go green, so auto-merge never fires and
    # React updates deadlock permanently. Their @types/* follow the same pair.
    # Mirrors the `nextjs-core` group in dcyfr-labs/dcyfr-labs.
    groups:
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      # vitest and @vitest/* must move in lockstep: every @vitest/* plugin
      # (coverage-v8, ui, browser-*) pins an exact `vitest` peer and refuses
      # to run against a different version. Ungrouped, Dependabot opens one
      # PR per package and each fails alone; that deadlocked vitest 5.0.1 in
      # dcyfr-ai-docker and dcyfr-ai-kubernetes. Only `vitest` is a direct
      # dependency here today; the group keeps any future @vitest/* in step.
      # No update-types filter: the deadlock bites hardest on majors.
      vitest:
        patterns: ["vitest", "@vitest/*"]

    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "ci"
    # changesets/action v2 requires @changesets/cli v3 and renamed several of
    # its inputs. Dependabot groups cannot span ecosystems, so this bump can
    # never be paired with the npm @changesets/cli bump: whichever lands first
    # breaks Release on main. That is exactly what happened across all ten
    # dcyfr-ai-* repos on 2026-08-22. Majors stay manual and must ship together
    # with the CLI bump; minor/patch updates still flow normally.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
